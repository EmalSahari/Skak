services:
  - type: web
    name: skak
    runtime: node
    plan: free
    branch: claude/multiplayer-chess-app-T8BQF
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Auth token signing secret — Render generates a random value.
      - key: AUTH_SECRET
        generateValue: true
      # Set this to a Postgres connection string (e.g. a free Neon database)
      # to enable accounts, ratings, and leaderboards. Leave unset to run
      # without accounts. Configured in the Render dashboard, not in git.
      - key: DATABASE_URL
        sync: false
      # OpenAI key — enables the post-game AI coach. Leave unset to hide it.
      - key: OPENAI_API_KEY
        sync: false
      # Stripe — enables Skak Pro subscriptions. Leave unset to disable upgrades.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Public URL of this app (used for Stripe Checkout return URLs).
      - key: APP_URL
        sync: false
