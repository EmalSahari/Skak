<!doctype html>

      content="online chess, 3 player chess, 4 player chess, multiplayer chess, free chess, play chess online, chess vs friends, chess vs computer, cross board chess"

      property="og:description"

        "name": "Skak",
        "description": "Free online chess for 2, 3, and 4 players. Play in real time against friends or computer.",

              "priceCurrency": "USD",
